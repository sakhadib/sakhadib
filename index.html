  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags. manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

in:0 auto;padding:0 clamp(20px,5vw,40px);display:flex;flex-wrap:wrap;gap:0 64px\">\n\n    <aside data-screen-label=\"Profile\" style=\"flex:1 1 240px;min-width:0\"><div style=\"position:sticky;top:56px;max-height:{{ asideMax }};overflow-y:{{ asideOverflow }};scrollbar-width:none;box-sizing:border-box;padding:clamp(28px,5vw,40px) 0 32px;display:flex;flex-direction:column;gap:22px\">\n      <div style=\"flex-shrink:0;display:flex;flex-direction:column;align-items:flex-start;gap:20px\"><div style=\"position:relative;width:{{ photoW }};flex:0 0 auto;line-height:0\"><img src=\"986abd0e-f99a-494e-991c-9ea47e85f174\" alt=\"Adib Sakhawat\" style=\"display:block;width:100%;aspect-ratio:4 / 5;height:auto;object-fit:cover;object-position:center 30%;border-radius:2px;background:#efede8;filter:saturate(0.9)\"><div style=\"position:absolute;inset:7px;border:1px solid rgba(251,250,248,0.9);pointer-events:none\"><\u002Fdiv><\u002Fdiv><div style=\"min-width:0\"><h1 style=\"margin:0;font-family:'Instrument Serif',serif;font-weight:400;font-size:46px;line-height:0.98;letter-spacing:-0.02em\">Adib<br>Sakhawat<\u002Fh1>\n        <p style=\"margin:18px 0 0;font-size:14.5px;line-height:1.6;color:#5c5b60\">NLP Researcher with a Software Engineering graduation. Experienced in doing research and shipping code within deadlines.<\u002Fp>\n      <\u002Fdiv><\u002Fdiv>\n      <div style=\"flex-shrink:0;display:flex;flex-direction:column;gap:12px;padding-top:22px;border-top:1px solid #e6e3dd\">\n        <a href=\"mailto:adibsakhawat@iut-dhaka.edu\" style=\"font-size:14px;line-height:1.5;color:#3b3a3f;display:flex;align-items:center;gap:8px;border-bottom:1px solid #8c2f22;padding-bottom:2px;align-self:flex-start\"><img src=\"https://cdn.jsdelivr.net/npm/lucide-static@latest/icons/mail.svg\" alt=\"\" width=\"15\" height=\"15\">adibsakhawat@iut-dhaka.edu<\u002Fa><a href=\"mailto:sakhadib@gmail.com\" style=\"font-size:14px;line-height:1.5;color:#3b3a3f;display:flex;align-items:center;gap:8px;border-bottom:1px solid #8c2f22;padding-bottom:2px;align-self:flex-start\"><img src=\"https://cdn.jsdelivr.net/npm/lucide-static@latest/icons/mail.svg\" alt=\"\" width=\"15\" height=\"15\">sakhadib@gmail.com<\u002Fa>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:6px 16px;font-size:13.5px\">\n          <a href=\"https://scholar.google.com/citations?user=usvtpskAAAAJ\" target=\"_blank\" style=\"color:#17171a;display:flex;align-items:center;gap:8px;border-bottom:1px solid #8c2f22;padding-bottom:2px\"><img src=\"assets/Google_Scholar_logo.svg.webp\" alt=\"\" style=\"width:16px;height:16px;object-fit:contain\">Scholar ↗<\u002Fa>\n          <a href=\"https://github.com/sakhadib\" target=\"_blank\" style=\"color:#17171a;display:flex;align-items:center;gap:8px;border-bottom:1px solid #8c2f22;padding-bottom:2px\"><img src=\"assets/github.png\" alt=\"\" style=\"width:16px;height:16px;object-fit:contain\">GitHub ↗<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv><\u002Faside>\n\n    <main style=\"flex:999 1 480px;min-width:0;padding:clamp(8px,6vw,56px) 0 0\">\n\n      <section id=\"about\" data-screen-label=\"About\" style=\"padding-bottom:clamp(72px,12vw,120px)\">\n        <div style=\"display:flex;align-items:center;gap:16px;margin-bottom:48px;font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:0.12em;text-transform:uppercase;color:#5c5b60\"><span style=\"color:#8c2f22\">01<\u002Fspan><span>About<\u002Fspan><span style=\"flex:1;height:1px;background:#e6e3dd\"><\u002Fspan><\u002Fdiv>\n        <p style=\"margin:0;font-family:'Instrument Serif',serif;font-size:clamp(28px,4.2vw,40px);line-height:1.18;letter-spacing:-0.01em;text-wrap:pretty\">I study how large language models behave <span class=\"tape\">when we measure them<\u002Fspan>: <em style=\"color:#8c2f22;animation:emPulse 18s ease-in-out infinite\">how their behaviour shift with <span style=\"animation:emPulse 18s ease-in-out infinite;animation-delay:-1s\">context<\u002Fspan><\u002Fem>, how they <span style=\"color:#1e7d46\">persuade<\u002Fspan> and <span style=\"color:#c0392b\">resist<\u002Fspan>, and how well they understand languages the field often leaves behind.<\u002Fp>\n        <p lang=\"en\" style=\"margin:40px 0 0;font-family:'Instrument Serif',serif;font-size:20px;line-height:1.7;color:#3b3a3f;text-align:justify;hyphens:auto;-webkit-hyphens:auto\">I am a Software Engineering graduate from the Department of Computer Science and Engineering, Islamic University of Technology (IUT), and a student researcher at the <a href=\"https://cse.iutoic-dhaka.edu/ssl\" target=\"_blank\" style=\"color:#17171a;border-bottom:1px solid #d6d2ca\">Systems and Software Lab ↗<\u002Fa>. My recent work models <em style=\"color:#8c2f22\">LLM political ideology as a context-conditioned distribution</em>, evaluates <em style=\"color:#8c2f22\">persuasion and resistance</em> in adversarial multi-turn dialogue, builds <em style=\"color:#8c2f22\">resources and benchmarks for figurative, low-resource language understanding in Bengali</em>, and models multilingual representation learning through unspoken language like <em style=\"color:#8c2f22\">emojis</em>.<\u002Fp>\n        <div style=\"margin-top:24px;display:flex;flex-wrap:wrap;gap:6px 22px;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:0.08em;text-transform:uppercase\">\n          <a href=\"https://dblp.org/pid/426/8216.html\" target=\"_blank\" style=\"color:#17171a;border-bottom:1px solid #8c2f22;padding-bottom:2px;font-weight:500;transition:color .2s,transform .2s;display:inline-block\" style-hover=\"color:#8c2f22;transform:translateY(-2px)\"><span style=\"display:inline-flex;align-items:center;gap:8px\"><img src=\"assets/dblp.png\" alt=\"\" style=\"width:15px;height:15px;object-fit:contain\"><span>DBLP ↗<\u002Fspan><\u002Fspan><\u002Fa>\n          <a href=\"https://aclanthology.org/people/adib-sakhawat/\" target=\"_blank\" style=\"color:#17171a;border-bottom:1px solid #8c2f22;padding-bottom:2px;font-weight:500;transition:color .2s,transform .2s;display:inline-block\" style-hover=\"color:#8c2f22;transform:translateY(-2px)\"><span style=\"display:inline-flex;align-items:center;gap:8px\"><img src=\"assets/acl.svg\" alt=\"\" style=\"width:15px;height:15px;object-fit:contain\"><span>ACL Anthology ↗<\u002Fspan><\u002Fspan><\u002Fa>\n          <a href=\"https://orcid.org/0009-0005-3549-8616\" target=\"_blank\" style=\"color:#17171a;border-bottom:1px solid #8c2f22;padding-bottom:2px;font-weight:500;transition:color .2s,transform .2s;display:inline-block\" style-hover=\"color:#8c2f22;transform:translateY(-2px)\"><span style=\"display:inline-flex;align-items:center;gap:8px\"><img src=\"assets/orcid.webp\" alt=\"\" style=\"width:15px;height:15px;object-fit:contain\"><span>ORCID ↗<\u002Fspan><\u002Fspan><\u002Fa>\n          <a href=\"https://huggingface.co/sakhadib\" target=\"_blank\" style=\"color:#17171a;border-bottom:1px solid #8c2f22;padding-bottom:2px;font-weight:500;transition:color .2s,transform .2s;display:inline-block\" style-hover=\"color:#8c2f22;transform:translateY(-2px)\"><span style=\"display:inline-flex;align-items:center;gap:8px\"><img src=\"assets/huggingface-color.png\" alt=\"\" style=\"width:15px;height:15px;object-fit:contain\"><span>Hugging Face ↗<\u002Fspan><\u002Fspan><\u002Fa>\n          <a href=\"https://kaggle.com/sakhadib\" target=\"_blank\" style=\"color:#17171a;border-bottom:1px solid #8c2f22;padding-bottom:2px;font-weight:500;transition:color .2s,transform .2s;display:inline-block\" style-hover=\"color:#8c2f22;transform:translateY(-2px)\"><span style=\"display:inline-flex;align-items:center;gap:8px\"><img src=\"assets/icons8-kaggle-96.png\" alt=\"\" style=\"width:15px;height:15px;object-fit:contain\"><span>Kaggle ↗<\u002Fspan><\u002Fspan><\u002Fa>\n          <a href=\"https://linkedin.com/in/sakhadib\" target=\"_blank\" style=\"color:#17171a;border-bottom:1px solid #8c2f22;padding-bottom:2px;font-weight:500;transition:color .2s,transform .2s;display:inline-block\" style-hover=\"color:#8c2f22;transform:translateY(-2px)\"><span style=\"display:inline-flex;align-items:center;gap:8px\"><img src=\"assets/linkedin-app-icon.svg\" alt=\"\" style=\"width:15px;height:15px;object-fit:contain\"><span>LinkedIn ↗<\u002Fspan><\u002Fspan><\u002Fa>\n        <\u002Fdiv>\n        <div style=\"margin-top:56px;border-top:1px solid #17171a;padding-top:36px\"><div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:24px\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:0.12em;text-transform:uppercase;color:#8c2f22\">The question that motivates me<\u002Fdiv><\u002Fdiv><p style=\"margin:18px 0 0;font-family:'Instrument Serif',serif;font-size:clamp(26px,3.4vw,38px);line-height:1.2;letter-spacing:-0.01em;text-wrap:balance\">How can we systematically uncover the behaviors of intelligent AI systems?<\u002Fp><p lang=\"en\" style=\"margin:22px 0 0;font-family:'Instrument Serif',serif;font-size:20px;line-height:1.7;color:#3b3a3f;text-align:justify;hyphens:auto;-webkit-hyphens:auto\">My research investigates <em style=\"color:#8c2f22\">intelligent computational systems</em> through <em style=\"color:#8c2f22\">systematic behavioral probing</em> rather than benchmark performance alone. Starting from observed behaviors and anomalies, I design <em style=\"color:#8c2f22\">controlled experiments</em> to characterize how systems respond to changing contexts and interventions, with current work centered on language models and AI agents.<\u002Fp><div style=\"margin-top:32px\"><a href=\"https://research.sakhawatadib.com\" target=\"_blank\" style=\"display:flex;align-items:stretch;gap:0;text-decoration:none\"><span style=\"flex-shrink:0;display:inline-flex;align-items:center;gap:10px;background:#17171a;color:#fbfaf8;font-family:'Instrument Serif',serif;font-size:18px;line-height:1;padding:16px 26px;border-radius:2px 0 0 2px;transition:background .2s\" style-hover=\"background:#8c2f22\">The Open Notebook ↗<\u002Fspan><span style=\"flex:1;display:flex;align-items:center;padding:10px 18px;border:1px dashed #8c2f22;border-left:0;border-radius:0 2px 2px 0;background:rgba(140,47,34,0.05);font-size:14.5px;line-height:1.5;color:#3b3a3f\">A living log of whatever I am thinking, training, and writing right now. Notes, papers, and work in progress, <em style=\"color:#8c2f22\">kept open<\u002Fem> for anyone curious.<\u002Fspan><\u002Fa><\u002Fdiv><\u002Fdiv>\n      <\u002Fsection>\n\n      <section id=\"publications\" data-screen-label=\"Publications\" style=\"padding-bottom:clamp(72px,12vw,120px)\">\n        <div style=\"display:flex;align-items:center;gap:16px;margin-bottom:24px;font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:0.12em;text-transform:uppercase;color:#5c5b60\"><span style=\"color:#8c2f22\">02<\u002Fspan><span>Publications<\u002Fspan><span style=\"flex:1;height:1px;background:#e6e3dd\"><\u002Fspan><a href=\"https://scholar.google.com/citations?user=usvtpskAAAAJ\" target=\"_blank\" style=\"color:#5c5b60\">Scholar ↗<\u002Fa><\u002Fdiv>\n        <sc-for list=\"{{ groups }}\" as=\"g\" hint-placeholder-count=\"3\">\n          <div style=\"margin-top:56px\">\n            <h3 style=\"margin:0 0 4px;font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;font-size:26px;color:#5c5b60\">{{ g.label }}<\u002Fh3>\n            <sc-if value=\"{{ g.isPre }}\"><div style=\"border-top:1px solid #e6e3dd\"><\u002Fdiv><\u002Fsc-if><sc-for list=\"{{ g.items }}\" as=\"p\" hint-placeholder-count=\"2\">\n              <sc-if value=\"{{ g.notPre }}\"><article style=\"display:flex;flex-wrap:wrap;gap:8px 32px;padding:32px 0;border-bottom:1px solid #e6e3dd\">\n                <div style=\"flex:1 0 100px;max-width:132px;padding-top:7px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;line-height:1.6;color:#8c2f22\">{{ p.tag }}<\u002Fdiv>\ le=\"font-size:15.5px;color:#17171a\">Junior Executive of Administration<\/div><div style=\"margin-top:3px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:#8a888e\">Aug 2023 – Oct 2024<\/div><\/div><\/div><\u002Fdiv><\u002Fdiv><\u002Fsection>\n\n      <footer data-screen-label=\"Contact\" style=\"padding:96px 0 72px;border-top:1px solid #17171a\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:0.12em;text-transform:uppercase;color:#5c5b60\">Correspondence<\u002Fdiv><p style=\"margin:22px 0 0;max-width:900px;font-family:'Instrument Serif',serif;font-size:clamp(34px,4.8vw,60px);line-height:1.08;letter-spacing:-0.015em\">Let's measure what others merely guess.<\u002Fp><p style=\"margin:26px 0 0;max-width:620px;font-size:16.5px;line-height:1.75;color:#3b3a3f\">I am looking for a PhD seat and good collaborators, on <em style=\"color:#8c2f22\">LLM evaluation, agentic AI</em>, and <em style=\"color:#8c2f22\">low-resource language technology</em>. If your lab touches those questions, I would love to hear from you.<\u002Fp><a href=\"mailto:adibsakhawat@iut-dhaka.edu\" style=\"display:inline-block;margin-top:40px;font-family:'Instrument Serif',serif;font-size:clamp(26px,3.6vw,44px);line-height:1.1;letter-spacing:-0.015em;word-break:break-word\" style-hover=\"color:#8c2f22\">adibsakhawat@<em>iut-dhaka.edu<\u002Fem><\u002Fa><a href=\"mailto:sakhadib@gmail.com\" style=\"display:flex;width:fit-content;margin-top:14px;align-items:center;gap:8px;font-size:15px;color:#3b3a3f;border-bottom:1px solid #8c2f22;padding-bottom:2px\" style-hover=\"color:#8c2f22\">sakhadib@gmail.com ↗<\u002Fa><p style=\"margin:28px 0 0;font-size:14.5px;color:#6b6a70\">Department of Computer Science and Engineering, Islamic University of Technology, Board Bazar, Gazipur 1704, Bangladesh<\u002Fp><div style=\"margin-top:64px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:0.08em;text-transform:uppercase;color:#8a888e\"><span>© 2026 Adib Sakhawat<\u002Fspan><span>Updated October 2026<\u002Fspan><\u002Fdiv><\u002Ffooter>\n    <\u002Fmain>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showPreprints&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;expandAbstracts&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;showReviewScores&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}\">\nconst ME = 'Adib Sakhawat';\nconst au = (s) => {\n  const list = s.split(', ');\n  return list.map((n, i) => ({ n, me: n === ME, other: n !== ME, sep: i < list.length - 1 ? ', ' : '' }));\n};\nconst ax = (id) => [{ label: 'arXiv', url: 'https://arxiv.org/abs/' + id }, { label: 'PDF', url: 'https://arxiv.org/pdf/' + id }];\n\nconst PUBS = [\n  { id: 'ideo', group: 'conf', tag: 'AACL 2026',\n    title: 'LLM-Ideoplasticity: Measuring Ideological Plasticity in the Political Behavior of LLMs as a Context-Conditioned Distribution',\n    authors: 'Adib Sakhawat, Syed Rifat Raiyan, Tahsin Islam, Takia Farhin, Hasan Mahmud, Md Kamrul Hasan',\n    venue: 'Asia-Pacific Chapter of the Association for Computational Linguistics (AACL 2026), Hengqin, China',\n    note: 'ARR May 2026 cycle reviewer ratings: 4, 4, 4.5',\n    leadNote: 'Led this work at Systems and Software Lab (SSL)',\n    thesisNote: 'Output of my undergraduate thesis',\n    supervisedNote: 'Supervised by Prof. Hasan Mahmud & Prof. Md Kamrul Hasan',\n    links: [...ax('2606.28335'), { label: 'Code', url: 'https://github.com/sakhadib/LLM-Ideoplasticity' }, { label: 'Project Page', url: 'https://sakhadib.github.io/LLM-Ideoplasticity/' }, { label: 'Models', url: 'https://github.com/sakhadib/LLM-Ideoplasticity/tree/main/models' }, { label: 'Results', url: 'https://github.com/sakhadib/LLM-Ideoplasticity/tree/main/Runs' }],\n    abstract: \"We argue, with systematic empirical evidence, that a large language model's political ideology is not a fixed point, but a conditional distribution ℙ(position∣context) over a real political space. We evaluate nine current LLMs using a unified measurement framework anchored by VAA-CHES projection models, which map responses onto three validated dimensions (lrgen, lrecon, galtan) across six contextual axes. Our findings reveal high sensitivity to context: persuasive framing and under-represented languages displace coordinates by up to 0.57 and 0.52 units, respectively, while chain-of-thought reasoning often amplifies rather than dampens paraphrase instability. Despite this local plasticity, the model cohort occupies a remarkably narrow Overton envelope overall, occupying roughly one-third the spread of major European parties. Supported by a multi-trait multi-method (MTMM) analysis, we conclude that a single point cannot summarize LLM political behavior; it must be characterized as a shape.\",\n    bib: `@misc{sakhawat2026llmideoplasticitymeasuringideologicalplasticity,\n  title={LLM-Ideoplasticity: Measuring Ideological Plasticity in the Political Behavior of LLMs as a Context-Conditioned Distribution},\n  author={Adib Sakhawat and Syed Rifat Raiyan and Tahsin Islam and Takia Farhin and Hasan Mahmud and Md Kamrul Hasan},\n  year={2026},\n  eprint={2606.28335},\n  archivePrefix={arXiv},\n  primaryClass={cs.CY},\n  url={https://arxiv.org/abs/2606.28335},\n}` },\n  { id: 'bagdhara', group: 'conf', tag: 'LREC 2026',\n    title: 'When Words Don’t Mean What They Say: Figurative Understanding in Bengali Idioms',\n    authors: 'Adib Sakhawat, Shamim Ara Parveen, Md Ruhul Amin, Tahera Khatun, Shamim Al Mahmud, Md Saiful Islam',\n    venue: 'The Fifteenth Language Resources and Evaluation Conference (LREC 2026), Palma, Mallorca, Spain',\n    note: 'LREC 2026 reviewer ratings: 4.5, 4.5, 5',\n    leadNote: 'Coordinated a team of senior Bangla domain experts in this work',\n    links: [{ label: 'Paper', url: 'https://aclanthology.org/2026.lrec-1.546/' }, { label: 'PDF', url: 'https://aclanthology.org/2026.lrec-1.546.pdf' }, { label: 'DOI', url: 'https://doi.org/10.63317/546w2cys6m6t' }, { label: 'Dataset', url: 'https://www.kaggle.com/datasets/sakhadib/bangla-bagdhara' }, { label: 'Website', url: 'https://sakhadib.github.io/bangla_bagdhara/' }, { label: 'Poster', url: 'http://www.lrec-conf.org/proceedings/lrec2026/media/posters/775.pdf' }, { label: 'Video', url: 'http://www.lrec-conf.org/proceedings/lrec2026/media/videos/775.mp4' }],\n    abstract: 'Figurative language understanding remains a significant challenge for Large Language Models (LLMs), especially for low-resource languages. To address this, we introduce the Bangla Bagdhara dataset, a large-scale, culturally grounded corpus of 10,361 Bengali idioms. Each idiom is annotated under a comprehensive 19-field schema, established and refined through a deliberative expert consensus process that captures its semantic, syntactic, cultural, and religious dimensions, providing a rich and structured resource for computational linguistics. To establish a robust benchmark for Bangla figurative language understanding, we evaluate 30 state-of-the-art multilingual and instruction-tuned LLMs on the task of inferring figurative meaning. Our results reveal a critical performance gap, with no model surpassing 50% accuracy, in stark contrast to significantly higher human performance (83.4%). This finding underscores the limitations of existing models in cross-linguistic and cultural reasoning. By releasing the Bangla Bagdhara dataset and benchmark, we provide foundational infrastructure for advancing figurative language understanding and cultural grounding in LLMs for Bengali and other low-resource languages.',\n    bib: `@inproceedings{sakhawat-etal-2026-when,\n  title = {When Words Don't Mean What They Say: Figurative Understanding in Bengali Idioms},\n  author = {Sakhawat, Adib and Parveen, Shamim Ara and Amin, Md Ruhul and Khatun, Tahera and Mahmud, Shamim Al and Islam, Md Saiful},\n  booktitle = {Proceedings of the Fifteenth Language Resources and Evaluation Conference (LREC 2026)},\n  month = {May},\n  year = {2026},\n  pages = {6870--6879},\n  address = {Palma, Mallorca, Spain},\n  publisher = {European Language Resources Association (ELRA)},\n  editor = {Piperidis, Stelios and Bel, Núria and van den Heuvel, Henk and Ide, Nancy and Krek, Simon and Toral, Antonio},\n  doi = {10.63317/546w2cys6m6t}\n}` },\n  { id: 'areg', group: 'ws', tag: 'ICML 2026 · Workshop',\n    title: 'AREG: Adversarial Resource Extraction Game for Evaluating Persuasion and Resistance in Large Language Models',\n    authors: 'Adib Sakhawat, Fardeen Sadab',\n    venue: 'MusIML Workshop at ICML 2026, Seoul, South Korea',\n    leadNote: 'Led this work at Systems and Software Lab (SSL)',\n    links: [...ax('2602.16639'), { label: 'Code', url: 'https://github.com/sakhadib/AREG' }, { label: 'Website', url: 'https://sakhadib.github.io/AREG/' }],\n    bib: `@misc{sakhawat2026aregadversarialresourceextraction,\n  title={AREG: Adversarial Resource Extraction Game for Evaluating Persuasion and Resistance in Large Language Models},\n  author={Adib Sakhawat and Fardeen Sadab},\n  year={2026},\n  eprint={2602.16639},\n  archivePrefix={arXiv},\n  primaryClass={cs.CL},\n  url={https://arxiv.org/abs/2602.16639},\n}`,\n    abstract: 'Evaluating the social intelligence of Large Language Models (LLMs) increasingly requires moving beyond static text generation toward dynamic, adversarial interaction. We introduce the Adversarial Resource Extraction Game (AREG), a benchmark that operationalizes persuasion and resistance as a multi-turn, zero-sum negotiation over financial resources. Using a round-robin tournament across frontier models, AREG enables joint evaluation of offensive (persuasion) and defensive (resistance) capabilities within a single interactional framework. Our analysis provides evidence that these capabilities are weakly correlated (ρ = 0.33) and empirically dissociated: strong persuasive performance does not reliably predict strong resistance, and vice versa. Across all evaluated models, resistance scores exceed persuasion scores, indicating a systematic defensive advantage in adversarial dialogue settings. Further linguistic analysis suggests that interaction structure plays a central role in these outcomes. Incremental commitment-seeking strategies are associated with higher extraction success, while verification-seeking responses are more prevalent in successful defenses than explicit refusal. Together, these findings indicate that social influence in LLMs is not a monolithic capability and that evaluation frameworks focusing on persuasion alone may overlook asymmetric behavioral vulnerabilities.',\n    bib: `@misc{sakhawat2026areg,\n  title={AREG: Adversarial Resource Extraction Game for Evaluating Persuasion and Resistance in Large Language Models},\n  author={Adib Sakhawat and Fardeen Sadab},\n  year={2026},\n  eprint={2602.16639},\n  archivePrefix={arXiv},\n  url={https://arxiv.org/abs/2602.16639},\n}` },\n  { id: 'emoji', group: 'ws', tag: 'EMNLP 2026 · Workshop', title: 'Two Emojis of Difference: What Multilingual Affective Generation Benchmarks Actually Measure', authors: 'Fardeen Sadab, Adib Sakhawat', venue: 'Workshop on Multilingual Representation Learning (MRL) at EMNLP 2026, Budapest, Hungary', links: [...ax('2609.29445'), { label: 'Website', url: 'https://sakhadib.github.io/EEA/' }], abstract: 'We audit a multilingual affective generation benchmark of eight instruction-tuned LLMs producing emoji summaries for 17,100 Bangla, English and Hindi sentences, with 6,960 human judgements, and find its headline conclusions to be artefacts of the measurement instrument rather than properties of the systems. Treating annotators as a random rather than fixed factor, no system differs significantly from any other (F(7,14)=0.59, p=0.76), although the conventional analysis declares 19 of 28 pairwise differences significant. The ordering that does emerge tracks output length: mean emoji count explains 78.7% of between-system variance, and a within-item length-matched comparison over 2,599 pairs reverses the leaderboard. We further show that cross-provider anisotropy differences vanish under mean-centring, per-language token costs change sign with the normalising unit, and multi-view row-wise splits inflate macro-F1 by 3.1 points. In place of preference scoring we propose emoji-affect decodability, a reference-based probe whose rankings are stable to ±0.003 macro-F1 across seeds.', bib: `@inproceedings{sadab2026twoemojis,\n  title={Two Emojis of Difference: What Multilingual Affective Generation Benchmarks Actually Measure},\n  author={Sadab, Fardeen and Sakhawat, Adib},\n  booktitle={Proceedings of the Workshop on Multilingual Representation Learning (MRL) at EMNLP 2026},\n  address={Budapest, Hungary},\n  year={2026}\n}` },\n  { id: 'aligned', group: 'pre', tag: 'arXiv 2026', title: 'Aligned in Form, Not in Meaning: The Comprehension-Containment Decoupling of LLM Safety in Low-Resource Bangla Derogatory Speech', authors: 'S. B. Habib, A. K. M. Habib, S. Neel, Adib Sakhawat', venue: 'arXiv preprint arXiv:2608.02941', links: ax('2608.02941') },\n  { id: 'blad', group: 'pre', tag: 'arXiv 2026', title: 'BLAD: A Historically Contextualized, Multilingual Dataset of Bangladeshi Legal Acts (1799 to 2025)', authors: 'Adib Sakhawat', venue: 'arXiv preprint arXiv:2607.17111', links: ax('2607.17111') },\n  { id: 'hub', group: 'pre', tag: 'arXiv 2026', title: 'Hubness, Not Anisotropy, Drives Cross-Lingual Retrieval Asymmetry in Multilingual Embedding Models', authors: 'Adib Sakhawat, Fardeen Sadab, A. Shahriar', venue: 'arXiv preprint arXiv:2605.26575', links: ax('2605.26575') },\n  { id: 'aidg', group: 'ws', tag: 'EMNLP 2026 · Workshop', title: 'AIDG: A Formal Decomposition of Information Extraction and Containment Asymmetries in Multi-Turn LLM Dialogue', authors: 'Adib Sakhawat, Fardeen Sadab, Rakin Shahriar', venue: 'REALM Workshop at EMNLP 2026, Budapest, Hungary',\n    leadNote: 'Led this work at Systems and Software Lab (SSL)', links: [...ax('2602.17443'), { label: 'Code', url: 'https://github.com/sakhadib/make_me_say' }, { label: 'Website', url: 'https://sakhadib.github.io/make_me_say/' }], abstract: 'Multi-turn LLM evaluation is typically reported as a single win-rate scalar, conflating distinct capabilities. We introduce AIDG (Adversarial Information Deduction Game), formalizing multi-turn adversarial dialogue as a two-player partially observable stochastic game (POSG) and decomposing performance along Seeker (extraction) and Holder (containment) roles. Across 439 games over six frontier LLMs, defensive performance is tightly clustered (sigma = 1.9 ELO) while offensive performance varies substantially (sigma = 53.3 ELO); confirmation framing increases extraction odds 7.75x over uninformed deduction (p < 0.00001); and constraint violations account for 41.3% of deductive failures, uncorrelated with scale (rho = 0.0). We use the decomposition to attribute the containment-over-extraction gap per model.', bib: `@misc{sakhawat2026aidgformaldecompositioninformation,\n  title={AIDG: A Formal Decomposition of Information Extraction and Containment Asymmetries in Multi-Turn LLM Dialogue},\n  author={Adib Sakhawat and Fardeen Sadab and Rakin Shahriar},\n  year={2026},\n  eprint={2602.17443},\n  archivePrefix={arXiv},\n  primaryClass={cs.CL},\n  url={https://arxiv.org/abs/2602.17443},\n}` },\n  { id: 'polalign', group: 'pre', tag: 'arXiv 2026', title: 'Political Alignment in Large Language Models: A Multidimensional Audit of Psychometric Identity and Behavioral Bias', authors: 'Adib Sakhawat, Tahsin Islam, Takia Farhin, Syed Rifat Raiyan, Hasan Mahmud, Md Kamrul Hasan', venue: 'arXiv preprint arXiv:2601.06194',\n    leadNote: 'Led this work at Systems and Software Lab (SSL)', links: [...ax('2601.06194'), { label: 'Code', url: 'https://github.com/sakhadib/PolAlignLLM' }] },\n];\n\nconst GROUPS = [\n  { key: 'conf', label: 'Conference papers' },\n  { key: 'ws', label: 'Workshop papers' },\n  { key: 'pre', label: 'Preprints' },\n];\n\nconst PROJECTS = [\n  { name: 'Shiddhanto', tech: 'Next.js · Research', url: 'https://github.com/sakhadib/siddhanto', desc: 'A decision-making platform that structures complex choices into a systematic funnel, evaluating options with the JEV model and model-assisted decision analysis. Exploring how AI decision models can support structured, context-aware human decision-making.' },\n  { name: 'ISHKAPON AI', tech: 'Desktop · Pyodide', url: 'https://github.com/sakhadib/ishkaponai', desc: 'Cross-platform AI problem solver for school students. Every number is computed by a sandboxed local Python runtime rather than recalled by the model; chats stay on-device.' },\n  { name: 'Reko', tech: 'Rust · Code Intelligence', url: 'https://github.com/sakhadib/Reko', desc: 'High-performance polyglot code extraction CLI in Rust that converts source repositories into a language-independent intermediate representation, with local embedding indexing and natural-language search across large codebases.' },\n  { name: 'Pi-Daytona-ChatBot', tech: 'TypeScript · AI Harness', url: 'https://github.com/sakhadib/Pi-Daytona-ChatBot', desc: 'Agentic TypeScript chatbot (React, Convex, Daytona, Pi Agent runtime) where each conversation runs in its own Daytona sandbox with tool execution logs, streaming events, sessions, and downloadable artifacts.' },\n  { name: 'AI Manim', tech: 'AI Video · Agentic Education', url: 'https://github.com/sakhadib/AiManim', desc: 'AI-powered mathematical animation pipeline: natural-language prompts in, rendered Manim videos out. LLMs plan explanations, generate and validate scene code, repair failed renders, and stitch scenes automatically.' },\n  { name: 'vmath', tech: 'Java · 2023', url: 'https://github.com/sakhadib/vmath', desc: 'Mathematics library covering coordinate geometry, trigonometry, matrices, combinatorics, vectors and number systems. Built with Takia Farhin, in the early AI era of 2023.' },\n];\n\nclass Component extends DCLogic {\n  state = { abs: {}, bib: {}, copied: null, preOpenId: null, rqOpen: false, wide: typeof window !== 'undefined' ? window.matchMedia('(min-width: 860px)').matches : true };\n  componentDidMount() {\n    this._mq = window.matchMedia('(min-width: 860px)');\n    this._on = (e) => this.setState({ wide: e.matches });\n    this._mq.addEventListener('change', this._on);\n    this.setState({ wide: this._mq.matches });\n  }\n  componentWillUnmount() { this._mq && this._mq.removeEventListener('change', this._on); }\n\n  copy(p) {\n    try { navigator.clipboard.writeText(p.bib); } catch (e) {}\n    this.setState({ copied: p.id });\n    clearTimeout(this._t);\n    this._t = setTimeout(() => this.setState({ copied: null }), 1600);\n  }\n\n  renderVals() {\n    const showPre = this.props.showPreprints ?? true;\n    const expandAll = this.props.expandAbstracts ?? false;\n    const showNote = this.props.showReviewScores ?? true;\n    const { abs, bib, copied } = this.state;\n    const mk = (p) => {\n      const absOpen = abs[p.id] === undefined ? expandAll && !!p.abstract : abs[p.id];\n      return {\n        ...p,\n        main: p.links[0].url,\n        authors: au(p.authors),\n        note: showNote ? (p.note || null) : null, noteLabel: p.note && showNote ? p.note.split('ratings:')[0] + 'ratings:' : null, noteScores: p.note && showNote ? p.note.split('ratings:')[1].split(',').map(s => s.trim()) : null,\n        bib: p.bib || null,\n        abstract: p.abstract || '',\n        absOpen: !!(absOpen && p.abstract),\n        bibOpen: !!bib[p.id],\n        absLabel: p.abstract ? (absOpen ? 'Hide abstract' : 'Abstract') : null,\n        bibLabel: bib[p.id] ? 'Hide BibTeX' : 'BibTeX',\n        copyLabel: copied === p.id ? 'Copied' : 'Copy',\n        absSym: absOpen ? '−' : '+',\n        bibSym: bib[p.id] ? '−' : '+',\n        toggleAbs: () => this.setState(s => ({ abs: { ...s.abs, [p.id]: !absOpen } })),\n        toggleBib: () => this.setState(s => ({ bib: { ...s.bib, [p.id]: !s.bib[p.id] } })),\n        copyBib: () => this.copy(p),\n      };\n    };\n    const groups = GROUPS\n      .filter(g => showPre || g.key !== 'pre')\n      .map(g => { const mapped = PUBS.filter(p => p.group === g.key).map(mk); return { key: g.key, label: g.label, isPre: g.key === 'pre', notPre: g.key !== 'pre', items: g.key === 'pre' ? mapped.map(p => ({ ...p, expanded: this.state.preOpenId === p.id, collapsed: this.state.preOpenId !== p.id, toggle: () => this.setState(s => ({ preOpenId: s.preOpenId === p.id ? null : p.id })) })) : mapped }; });\n    const w = this.state.wide;\n    return { groups, projects: PROJECTS, asideMax: w ? 'calc(100vh - 56px)' : 'none', photoW: w ? '90%' : '136px', rqOpen: this.state.rqOpen, toggleRq: () => this.setState(s => ({ rqOpen: !s.rqOpen })), rqSym: this.state.rqOpen ? '−' : '+', wide: w, asideOverflow: w ? 'auto' : 'visible', navDir: w ? 'column' : 'row' };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
